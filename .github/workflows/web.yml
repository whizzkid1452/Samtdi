name: Web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      AYOTBI_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/collaboration/go.mod
          cache-dependency-path: services/collaboration/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: ops/verify-web.sh
      - working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:api
          git diff --exit-code lib/api-types.ts
          pnpm lint
          pnpm typecheck
          pnpm build
